<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山手線 Stamp Rally — Running Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, 'Segoe UI', 'Noto Sans JP', sans-serif; background: #f8f9fa; }
  #map { height: 100vh; }

  /* ===== Light Theme: Retractable Header ===== */
  .header-wrapper {
    position: absolute;
    top: 10px;
    left: 0;
    z-index: 1000;
    display: flex;
    align-items: flex-start;
  }

  .header-toggle {
    width: 38px;
    height: 38px;
    background: #2563eb;
    border: none;
    border-radius: 0 10px 10px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 16px;
    color: #fff;
    box-shadow: 0 2px 8px rgba(37,99,235,0.3);
    transition: all 0.25s ease;
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    padding: 0;
    line-height: 1;
  }
  .header-toggle:hover {
    background: #1d4ed8;
    transform: scale(1.04);
    box-shadow: 0 4px 12px rgba(37,99,235,0.4);
  }
  .header-toggle:active { transform: scale(0.95); }

  .header-panel {
    background: #ffffff;
    border: 1px solid #e2e8f0;
    border-left: none;
    border-radius: 0 12px 12px 0;
    padding: 12px 18px;
    min-width: 280px;
    max-width: 320px;
    box-shadow: 2px 2px 16px rgba(0,0,0,0.06);
    overflow: hidden;
    transition: all 0.3s ease;
    margin-left: -2px;
  }

  .header-panel.collapsed {
    max-width: 0;
    min-width: 0;
    padding: 12px 0;
    border: none;
    box-shadow: none;
    opacity: 0;
    pointer-events: none;
  }

  .header-panel .badge {
    display: inline-block; background: #eff6ff; color: #2563eb; font-size: 10px;
    padding: 2px 8px; border-radius: 4px; font-weight: 600; letter-spacing: 0.3px;
    margin-bottom: 6px;
  }
  .header-panel h1 { font-size: 17px; color: #1e293b; margin-bottom: 2px; white-space: nowrap; font-weight: 700; }
  .header-panel h1 span { font-size: 13px; }
  .header-panel .sub { font-size: 11px; color: #64748b; margin-bottom: 8px; white-space: nowrap; }
  .header-panel .stats { display: flex; gap: 10px; }
  .header-panel .stats .stat { text-align: center; min-width: 48px; }
  .header-panel .stats .stat .val { font-weight: 700; color: #2563eb; font-size: 15px; font-variant-numeric: tabular-nums; }
  .header-panel .stats .stat .lbl { color: #94a3b8; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3px; }

  /* ===== Light Station Popup ===== */
  .station-popup { font-family: -apple-system, 'Segoe UI', 'Noto Sans JP', sans-serif; line-height: 1.5; min-width: 220px; }
  .station-popup .sp-hdr { font-size: 1em; font-weight: 700; color: #1e293b; text-align: center; padding-bottom: 5px; border-bottom: 2px solid #e2e8f0; margin-bottom: 6px; }
  .station-popup .sp-hdr .sp-en { font-size: 0.7em; font-weight: 400; color: #64748b; display: block; }
  .station-popup .sp-stamp { background: #fefce8; border: 1px solid #fde68a; border-radius: 6px; padding: 5px 10px; margin-bottom: 7px; }
  .station-popup .sp-stamp .sp-stamp-title { font-weight: 700; color: #b45309; font-size: 10px; margin-bottom: 1px; }
  .station-popup .sp-stamp .sp-stamp-loc { color: #334155; font-size: 11px; line-height: 1.4; }
  .station-popup .sp-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; font-size: 12px; }
  .station-popup .sp-row .label { color: #94a3b8; }
  .station-popup .sp-row .dist { font-weight: 600; color: #334155; }
  .station-popup .sp-row .here { font-weight: 700; color: #2563eb; }

  .leaflet-popup-content-wrapper {
    background: #ffffff !important;
    color: #1e293b !important;
    border-radius: 10px !important;
    box-shadow: 0 4px 20px rgba(0,0,0,0.1) !important;
    border: 1px solid #e2e8f0 !important;
  }
  .leaflet-popup-tip {
    background: #ffffff !important;
    border: 1px solid #e2e8f0 !important;
  }

  /* ===== Light Station List ===== */
  .station-list {
    position: absolute; bottom: 16px; left: 10px; right: 10px; z-index: 1000;
    background: #ffffff;
    border-radius: 12px;
    box-shadow: 0 -2px 16px rgba(0,0,0,0.06);
    max-height: 180px; overflow-y: auto;
    border: 1px solid #e2e8f0;
    padding: 8px 12px;
  }
  .station-list::-webkit-scrollbar { width: 3px; }
  .station-list::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 3px; }
  .station-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 3px; }
  .station-item {
    display: flex; align-items: center; gap: 5px; padding: 4px 7px;
    border-radius: 6px; cursor: pointer; transition: all 0.12s; font-size: 12px;
    border-left: 2px solid transparent;
  }
  .station-item:hover { background: #f1f5f9; border-left-color: #2563eb; }
  .station-item .num { 
    font-weight: 700; color: #fff; background: #2563eb; 
    width: 18px; height: 18px; border-radius: 4px; display: flex;
    align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0;
  }
  .station-item .sname { font-weight: 600; color: #1e293b; }
  .station-item .sdist { color: #94a3b8; font-size: 10px; margin-left: auto; }

  @media (max-width: 480px) {
    .header-panel { min-width: 220px; max-width: 260px; padding: 10px 12px; }
    .header-panel h1 { font-size: 14px; }
    .header-panel .stats { gap: 6px; }
    .header-panel .stats .stat .val { font-size: 13px; }
    .station-grid { grid-template-columns: repeat(auto-fill, minmax(90px, 1fr)); }
  }
</style>
</head>
