<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山手線 Stamp Rally — Optimized Running Route</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Noto Sans JP', sans-serif; background: #f5f0eb; }
  #map { height: 100vh; }

  /* ===== Retractable Header - Slide from Left ===== */
  .header-wrapper {
    position: absolute;
    top: 10px;
    left: 0;
    z-index: 1000;
    display: flex;
    align-items: flex-start;
  }

  .header-toggle {
    width: 40px;
    height: 40px;
    background: #c62828;
    border: none;
    border-radius: 0 12px 12px 0;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 18px;
    color: #fff;
    box-shadow: 0 4px 15px rgba(198,40,40,0.35);
    transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    flex-shrink: 0;
    position: relative;
    z-index: 2;
    padding: 0;
    line-height: 1;
  }
  .header-toggle:hover {
    background: #b71c1c;
    transform: scale(1.05);
    box-shadow: 0 6px 20px rgba(198,40,40,0.45);
  }
  .header-toggle:active {
    transform: scale(0.95);
  }

  .header-panel {
    background: rgba(245,240,235,0.97);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(200,180,160,0.3);
    border-left: none;
    border-radius: 0 14px 14px 0;
    padding: 14px 20px;
    min-width: 300px;
    max-width: 340px;
    box-shadow: 4px 4px 20px rgba(0,0,0,0.1);
    overflow: hidden;
    transition: all 0.35s cubic-bezier(0.4, 0, 0.2, 1);
    margin-left: -2px;
  }

  .header-panel.collapsed {
    max-width: 0;
    min-width: 0;
    padding: 14px 0;
    border: none;
    box-shadow: none;
    opacity: 0;
    pointer-events: none;
  }

  .header-panel h1 { font-size: 18px; color: #c62828; margin-bottom: 4px; white-space: nowrap; }
  .header-panel h1 span { font-size: 14px; }
  .header-panel .sub { font-size: 12px; color: #888; margin-bottom: 8px; white-space: nowrap; }
  .header-panel .stats { display: flex; gap: 12px; font-size: 13px; }
  .header-panel .stats .stat { text-align: center; min-width: 50px; }
  .header-panel .stats .stat .val { font-weight: 700; color: #c62828; font-size: 16px; }
  .header-panel .stats .stat .lbl { color: #999; font-size: 10px; }

  .station-popup { font-family: 'Segoe UI', 'Noto Sans JP', sans-serif; line-height: 1.6; min-width: 200px; }
  .station-popup .sp-hdr { font-size: 1.1em; font-weight: bold; color: #c62828; text-align: center; padding-bottom: 6px; border-bottom: 2px solid #ffcdd2; margin-bottom: 8px; }
  .station-popup .sp-row { display: flex; justify-content: space-between; align-items: center; padding: 3px 0; }
  .station-popup .sp-row .label { color: #888; font-size: 0.85em; }
  .station-popup .sp-row .dist { font-weight: 600; color: #555; }
  .station-popup .sp-row .here { font-weight: 700; color: #c62828; }

  .station-list {
    position: absolute; bottom: 20px; left: 10px; right: 10px; z-index: 1000;
    background: rgba(245,240,235,0.95); border-radius: 14px;
    box-shadow: 0 -2px 20px rgba(0,0,0,0.1); max-height: 200px; overflow-y: auto;
    backdrop-filter: blur(8px); border: 1px solid rgba(200,180,160,0.3);
    padding: 10px 12px;
  }
  .station-list::-webkit-scrollbar { width: 4px; }
  .station-list::-webkit-scrollbar-thumb { background: #ccc; border-radius: 4px; }
  .station-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 4px; }
  .station-item {
    display: flex; align-items: center; gap: 6px; padding: 5px 8px;
    border-radius: 8px; cursor: pointer; transition: all 0.15s; font-size: 12px;
    border-left: 3px solid transparent;
  }
  .station-item:hover { background: #ffe0e0; border-left-color: #c62828; transform: translateY(-1px); }
  .station-item .num { 
    font-weight: 700; color: #fff; background: #c62828; 
    width: 20px; height: 20px; border-radius: 50%; display: flex;
    align-items: center; justify-content: center; font-size: 9px; flex-shrink: 0;
  }
  .station-item .sname { font-weight: 600; color: #333; }
  .station-item .sdist { color: #999; font-size: 10px; margin-left: auto; }

  @media (max-width: 480px) {
    .header-panel { min-width: 240px; max-width: 280px; padding: 10px 14px; }
    .header-panel h1 { font-size: 15px; }
    .header-panel .stats { gap: 8px; font-size: 11px; }
    .header-panel .stats .stat .val { font-size: 14px; }
    .station-grid { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
  }
</style>
</head>
