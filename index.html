  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', 'Noto Sans JP', -apple-system, sans-serif; background: #0f1923; }
  #map { height: 100vh; }

  .header-wrapper { position: absolute; top: 10px; left: 0; z-index: 1000; display: flex; align-items: flex-start; }
  .header-toggle { width: 38px; height: 38px; background: #1e96fc; border: none; border-radius: 0 10px 10px 0; cursor: pointer; display: flex; align-items: center; justify-content: center; font-size: 16px; color: #fff; box-shadow: 0 4px 15px rgba(30,150,252,0.4); transition: all 0.3s ease; flex-shrink: 0; position: relative; z-index: 2; padding: 0; line-height: 1; }
  .header-toggle:hover { background: #1a7ad4; transform: scale(1.05); }
  .header-toggle:active { transform: scale(0.95); }

  .header-panel { background: rgba(15,25,35,0.94); backdrop-filter: blur(14px); border: 1px solid rgba(30,150,252,0.2); border-left: none; border-radius: 0 12px 12px 0; padding: 14px 18px; min-width: 290px; max-width: 330px; box-shadow: 4px 4px 24px rgba(0,0,0,0.5); overflow: hidden; transition: all 0.35s ease; margin-left: -2px; }
  .header-panel.collapsed { max-width: 0; min-width: 0; padding: 14px 0; border: none; box-shadow: none; opacity: 0; pointer-events: none; }

  .header-panel .badge { display: inline-block; background: #1e96fc; color: #fff; font-size: 9px; padding: 1px 7px; border-radius: 3px; font-weight: 700; letter-spacing: 0.5px; margin-bottom: 6px; text-transform: uppercase; }
  .header-panel h1 { font-size: 17px; color: #fff; margin-bottom: 2px; white-space: nowrap; font-weight: 600; }
  .header-panel .sub { font-size: 11px; color: #8a9bb5; margin-bottom: 8px; white-space: nowrap; }
  .header-panel .stats { display: flex; gap: 10px; }
  .header-panel .stats .stat { text-align: center; min-width: 48px; }
  .header-panel .stats .stat .val { font-weight: 700; color: #1e96fc; font-size: 15px; font-variant-numeric: tabular-nums; }
  .header-panel .stats .stat .lbl { color: #6b7d99; font-size: 9px; text-transform: uppercase; letter-spacing: 0.3px; }

  .station-popup { font-family: 'Segoe UI', 'Noto Sans JP', sans-serif; line-height: 1.5; min-width: 220px; }
  .station-popup .sp-hdr { font-size: 1.05em; font-weight: 600; color: #1e96fc; text-align: center; padding-bottom: 5px; border-bottom: 1px solid rgba(30,150,252,0.2); margin-bottom: 6px; }
  .station-popup .sp-hdr .sp-en { font-size: 0.7em; font-weight: 400; color: #8a9bb5; display: block; }
  .station-popup .sp-stamp { background: rgba(30,150,252,0.08); border: 1px solid rgba(30,150,252,0.2); border-radius: 6px; padding: 5px 10px; margin-bottom: 7px; }
  .station-popup .sp-stamp .sp-stamp-title { font-weight: 600; color: #1e96fc; font-size: 10px; margin-bottom: 1px; text-transform: uppercase; letter-spacing: 0.3px; }
  .station-popup .sp-stamp .sp-stamp-loc { color: #c8d6e5; font-size: 11px; line-height: 1.4; }
  .station-popup .sp-row { display: flex; justify-content: space-between; align-items: center; padding: 2px 0; font-size: 11px; }
  .station-popup .sp-row .label { color: #6b7d99; }
  .station-popup .sp-row .dist { font-weight: 600; color: #c8d6e5; }
  .station-popup .sp-row .here { font-weight: 600; color: #1e96fc; }

  .leaflet-popup-content-wrapper { background: #1a2535 !important; color: #e0e8f0 !important; border-radius: 10px !important; box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important; border: 1px solid rgba(30,150,252,0.15) !important; }
  .leaflet-popup-tip { background: #1a2535 !important; }
  .leaflet-popup-close-button { color: #6b7d99 !important; }

  .station-list { position: absolute; bottom: 16px; left: 10px; right: 10px; z-index: 1000; background: rgba(15,25,35,0.94); border-radius: 12px; box-shadow: 0 -2px 24px rgba(0,0,0,0.4); max-height: 180px; overflow-y: auto; backdrop-filter: blur(14px); border: 1px solid rgba(30,150,252,0.12); padding: 8px 12px; }
  .station-list::-webkit-scrollbar { width: 3px; }
  .station-list::-webkit-scrollbar-thumb { background: #1e96fc; border-radius: 3px; }
  .station-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 3px; }
  .station-item { display: flex; align-items: center; gap: 5px; padding: 4px 7px; border-radius: 6px; cursor: pointer; transition: all 0.15s; font-size: 11px; border-left: 2px solid transparent; }
  .station-item:hover { background: rgba(30,150,252,0.1); border-left-color: #1e96fc; }
  .station-item.active { background: rgba(30,150,252,0.18); border-left-color: #1e96fc; box-shadow: inset 0 0 0 1px rgba(30,150,252,0.18); }
  .station-item .num { font-weight: 700; color: #fff; background: #1e96fc; width: 18px; height: 18px; border-radius: 4px; display: flex; align-items: center; justify-content: center; font-size: 8px; flex-shrink: 0; }
  .station-item .sname { font-weight: 500; color: #c8d6e5; }
  .station-item .sdist { color: #6b7d99; font-size: 9px; margin-left: auto; }

  .locate-control.leaflet-bar { border: none; box-shadow: 0 4px 15px rgba(0,0,0,0.28); }
  .locate-control button { width: 34px; height: 34px; border: none; border-radius: 6px; background: rgba(15,25,35,0.94); color: #c8d6e5; cursor: pointer; font-size: 17px; line-height: 34px; transition: all 0.2s ease; }
  .locate-control button:hover { background: #1a2535; color: #fff; }
  .locate-control button.tracking { background: #1e96fc; color: #fff; }
  .locate-control button.locating { animation: locate-pulse 1s ease-in-out infinite; }
  .user-location-icon { background: transparent; border: none; }
  .user-location-pulse { width: 18px; height: 18px; border-radius: 50%; background: #14b8a6; border: 2px solid #fff; box-shadow: 0 0 0 2px rgba(20,184,166,0.28), 0 2px 10px rgba(0,0,0,0.35); position: relative; }
  .user-location-pulse::after { content: ''; position: absolute; inset: -7px; border: 2px solid rgba(20,184,166,0.4); border-radius: 50%; animation: user-location-pulse 1.8s ease-out infinite; }
  @keyframes locate-pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.58; } }
  @keyframes user-location-pulse { from { transform: scale(0.55); opacity: 0.9; } to { transform: scale(1.9); opacity: 0; } }

  @media (max-width: 640px) {
    .header-panel { min-width: 220px; max-width: 260px; padding: 10px 12px; }
    .header-panel h1 { font-size: 14px; }
    .station-list {
      bottom: 12px;
      left: 8px;
      right: 8px;
      max-height: none;
      overflow-x: auto;
      overflow-y: hidden;
      padding: 7px 8px;
      border-radius: 10px;
      scroll-snap-type: x mandatory;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-x;
    }
    .station-list::-webkit-scrollbar { height: 3px; width: 0; }
    .station-grid {
      display: flex;
      grid-template-columns: none;
      gap: 7px;
      width: max-content;
    }
    .station-item {
      flex: 0 0 auto;
      min-width: 148px;
      height: 34px;
      padding: 5px 8px;
      border-left: none;
      border-bottom: 2px solid transparent;
      scroll-snap-align: start;
      white-space: nowrap;
    }
    .station-item:hover { border-left-color: transparent; border-bottom-color: #1e96fc; }
    .station-item.active { border-left-color: transparent; border-bottom-color: #1e96fc; }
    .station-item .num { width: 22px; height: 22px; font-size: 9px; }
    .station-item .sname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 84px; }
    .station-item .sdist { font-size: 10px; }
  }

const stationList = document.querySelector('.station-list');
const stationItems = [];
const markers = [];
const STATION_PROXIMITY_METERS = 10;
let activeStationIndex = null;
let lastGpsStationIndex = null;
let userLocationMarker = null;
let userAccuracyCircle = null;
let locateButton = null;
let gpsTracking = false;
let centeredOnFirstGpsFix = false;

function focusStationButton(index, behavior = 'smooth') {
  const item = stationItems[index];
  if (!item || !stationList) return;

  if (activeStationIndex !== null && stationItems[activeStationIndex]) {
    stationItems[activeStationIndex].classList.remove('active');
  }
  activeStationIndex = index;
  item.classList.add('active');

  stationList.scrollTo({
    left: item.offsetLeft - ((stationList.clientWidth - item.offsetWidth) / 2),
    top: item.offsetTop - ((stationList.clientHeight - item.offsetHeight) / 2),
    behavior: behavior
  });
}

function nearestStationTo(latlng) {
  return stationsData.reduce(function(nearest, station, index) {
    const distance = map.distance(latlng, [station.lat, station.lon]);
    return distance < nearest.distance ? { index: index, distance: distance } : nearest;
  }, { index: -1, distance: Infinity });
}

function setLocateButtonState(state) {
  if (!locateButton) return;
  locateButton.classList.toggle('tracking', state === 'tracking');
  locateButton.classList.toggle('locating', state === 'locating');
}

function updateUserLocation(e) {
  const accuracy = Math.round(e.accuracy);
  const popupText = 'GPS location<br>Accuracy: ' + accuracy + ' m';

  if (!userLocationMarker) {
    const userIcon = L.divIcon({
      className: 'user-location-icon',
      html: '<div class="user-location-pulse"></div>',
      iconSize: [22, 22],
      iconAnchor: [11, 11]
    });
    userLocationMarker = L.marker(e.latlng, { icon: userIcon, zIndexOffset: 1000 }).addTo(map).bindPopup(popupText);
  } else {
    userLocationMarker.setLatLng(e.latlng).setPopupContent(popupText);
  }

  if (!userAccuracyCircle) {
    userAccuracyCircle = L.circle(e.latlng, {
      radius: e.accuracy,
      color: '#14b8a6',
      weight: 1,
      fillColor: '#14b8a6',
      fillOpacity: 0.1
    }).addTo(map);
  } else {
    userAccuracyCircle.setLatLng(e.latlng).setRadius(e.accuracy);
  }

  if (!centeredOnFirstGpsFix) {
    map.setView(e.latlng, Math.max(map.getZoom(), 16));
    centeredOnFirstGpsFix = true;
  }

  const nearest = nearestStationTo(e.latlng);
  if (nearest.distance <= STATION_PROXIMITY_METERS) {
    if (nearest.index !== lastGpsStationIndex) {
      lastGpsStationIndex = nearest.index;
      focusStationButton(nearest.index);
    }
  } else {
    lastGpsStationIndex = null;
  }

  setLocateButtonState('tracking');
}

function handleLocationError(e) {
  gpsTracking = false;
  setLocateButtonState('idle');
  alert(e.message);
}

function startGpsTracking() {
  if (!navigator.geolocation) {
    alert('GPS is not available in this browser.');
    return;
  }

  gpsTracking = true;
  centeredOnFirstGpsFix = false;
  setLocateButtonState('locating');
  map.locate({
    watch: true,
    setView: false,
    enableHighAccuracy: true,
    timeout: 15000,
    maximumAge: 5000
  });
}

function stopGpsTracking() {
  gpsTracking = false;
  map.stopLocate();
  setLocateButtonState('idle');
}

    L.DomEvent.disableClickPropagation(container);
    L.DomEvent.on(locateButton, 'click', function(e) {
      L.DomEvent.stop(e);
      gpsTracking ? stopGpsTracking() : startGpsTracking();
    });
    return container;
  }
});
new LocateControl().addTo(map);
