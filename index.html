<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>山手線 Walking/Running Loop 🚶‍♂️</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #f5f0eb; color: #2c2c2c; }
  #header { background: linear-gradient(135deg, #c62828, #e53935); padding: 20px; text-align: center; border-bottom: 3px solid #b71c1c; }
  #header h1 { font-size: 1.8em; margin-bottom: 5px; color: #fff; }
  #header h1 span { color: #ffd700; }
  #header .sub { color: #ffe0b2; font-size: 0.9em; }
  #stats { display: flex; justify-content: center; gap: 20px; padding: 15px; background: #fff; flex-wrap: wrap; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
  .stat-card { background: #fff5f5; border-radius: 10px; padding: 12px 24px; text-align: center; min-width: 120px; border: 1px solid #ffcdd2; }
  .stat-card .num { font-size: 1.5em; font-weight: bold; color: #c62828; }
  .stat-card .label { font-size: 0.8em; color: #666; }
  #map { height: 600px; width: 100%; border-bottom: 3px solid #c62828; }
  #station-list { padding: 20px; max-width: 800px; margin: 0 auto; }
  #station-list h2 { text-align: center; margin-bottom: 15px; color: #c62828; }
  .station-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 8px; }
  .station-item { background: #fff; padding: 8px; border-radius: 6px; text-align: center; font-size: 0.85em; border-left: 3px solid #c62828; box-shadow: 0 1px 4px rgba(0,0,0,0.08); cursor: pointer; transition: all 0.2s; }
  .station-item:hover { background: #ffe0e0; border-left-color: #b71c1c; transform: translateY(-1px); }
  .station-item .num { color: #c62828; font-weight: bold; font-size: 0.7em; }
  .station-popup { font-family: 'Segoe UI', sans-serif; line-height: 1.6; min-width: 200px; }
  .station-popup .sp-hdr { font-size: 1.1em; font-weight: bold; color: #c62828; text-align: center; padding-bottom: 6px; border-bottom: 2px solid #ffcdd2; margin-bottom: 8px; }
  .station-popup .sp-row { display: flex; justify-content: space-between; align-items: center; padding: 4px 0; }
  .station-popup .sp-station { font-weight: 600; }
  .station-popup .sp-dist { color: #666; font-size: 0.85em; }
  .station-popup .sp-this { color: #c62828; font-weight: 700; font-size: 1.05em; }
  .station-popup .sp-arrow { color: #999; font-size: 0.9em; }
  #footer { text-align: center; padding: 15px; color: #888; font-size: 0.8em; }
  .legend { display: flex; justify-content: center; gap: 20px; padding: 10px; background: #fff; }
  .legend-item { display: flex; align-items: center; gap: 5px; font-size: 0.85em; color: #333; }
  .legend-color { width: 30px; height: 4px; border-radius: 2px; }
</style>
</head>
<body>
<div id="header">
  <h1>🚃 <span>山手線</span> Walking / Running Loop</h1>
  <div class="sub">沿住東京山手線嘅行人/跑步環狀路線 🏃‍♂️🚶‍♂️</div>
</div>

<div id="stats">
  <div class="stat-card">
    <div class="num">50.5</div>
    <div class="label">Total Distance (km)</div>
  </div>
  <div class="stat-card">
    <div class="num">30</div>
    <div class="label">Stations</div>
  </div>
  <div class="stat-card">
    <div class="num">2458</div>
    <div class="label">Track Points</div>
  </div>
  <div class="stat-card">
    <div class="num">~10h Walk</div>
    <div class="label">~5h Run</div>
  </div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-color" style="background:#d32f2f;"></div> Walking Route</div>
  <div class="legend-item"><div style="width:12px;height:12px;border-radius:50%;background:#ffc107;border:3px solid #d32f2f;"></div> Yamanote Station</div>
</div>

<div id="map"></div>

<div id="station-list">
  <h2>🚉 山手線駅一覧</h2>
  <div class="station-grid" id="stations"></div>
</div>

<div id="footer">
  Generated by Tiny爪 🐾 | Data: OpenStreetMap + OSRM | Route: Walking Profile
</div>

<script>
const routeGeoJSON = {"type": "FeatureCollection", "features": [{"type": "Feature", "properties": {"name": "\u5c71\u624b\u7dda Walking Loop"}, "geometry": {"type": "LineString", "coordinates": [[139.764961, 35.680592], [139.76488, 35.68072], [139.764865, 35.680743], [139.764745, 35.680921], [139.764728, 35.680954], [139.764719, 35.680983], [139.76472, 35.681012], [139.764763, 35.681153], [139.764771, 35.681176], [139.764785, 35.681194], [139.764797, 35.681206], [139.764815, 35.681214], [139.76484, 35.681216], [139.764877, 35.681208], [139.765068, 35.681166], [139.765089, 35.681156], [139.765106, 35.681141], [139.765118, 35.681126], [139.765127, 35.681108], [139.765131, 35.681089], [139.765129, 35.681068], [139.76509, 35.680967], [139.765072, 35.68092], [139.765055, 35.680856], [139.765055, 35.680802], [139.765058, 35.680748], [139.765069, 35.680666], [139.765096, 35.680582], [139.765107, 35.680529], [139.765107, 35.680474], [139.7651, 35.680434], [139.765075, 35.680356], [139.76498, 35.680261], [139.764471, 35.680378], [139.764425, 35.680389], [139.764244, 35.680426], [139.764317, 35.680637], [139.764331, 35.680681], [139.764548, 35.681338], [139.76456, 35.681374], [139.764602, 35.681502], [139.764664, 35.681686], [139.764728, 35.68187], [139.764766, 35.681985], [139.764778, 35.68202], [139.765004, 35.682705], [139.765084, 35.682959], [139.765137, 35.683113], [139.765222, 35.683365], [139.765518, 35.684248], [139.765644, 35.684588], [139.76569, 35.684699], [139.765717, 35.684763], [139.765743, 35.684826], [139.765783, 35.684922], [139.76585, 35.685114], [139.7659, 35.685298], [139.766055, 35.685935], [139.766068, 35.685997], [139.766151, 35.686386], [139.766174, 35.68648], [139.766188, 35.686543], [139.766212, 35.686649], [139.766354, 35.687298], [139.766425, 35.687621], [139.766634, 35.688552], [139.766665, 35.688684], [139.766751, 35.689052], [139.76685, 35.689459], [139.766883, 35.689595], [139.766915, 35.689728], [139.766971, 35.689982], [139.766991, 35.690075],...
const stationsData = [...];

// ─── Haversine distance (km) ───
function haversineKm(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLon/2)**2;
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// ─── Distance along route between two indices ───
function routeDistBetween(routeCoords, i1, i2) {
  let dist = 0;
  const start = Math.min(i1, i2);
  const end = Math.max(i1, i2);
  for (let i = start; i < end; i++) {
    dist += haversineKm(routeCoords[i][1], routeCoords[i][0], routeCoords[i+1][1], routeCoords[i+1][0]);
  }
  return dist;
}

// ─── Find closest route point index for each station ───
const routeCoords = routeGeoJSON.features[0].geometry.coordinates;
const stationRouteIdx = stationsData.map(s => {
  let bestIdx = 0, bestDist = Infinity;
  for (let i = 0; i < routeCoords.length; i++) {
    const d = haversineKm(s.lat, s.lon, routeCoords[i][1], routeCoords[i][0]);
    if (d < bestDist) { bestDist = d; bestIdx = i; }
  }
  return bestIdx;
});

// ─── Precompute distances between consecutive stations (along route) ───
const stationDists = [];
for (let i = 0; i < stationsData.length; i++) {
  const prev_i = (i - 1 + stationsData.length) % stationsData.length;
  const next_i = (i + 1) % stationsData.length;
  const distFromPrev = routeDistBetween(routeCoords, stationRouteIdx[prev_i], stationRouteIdx[i]);
  const distToNext = routeDistBetween(routeCoords, stationRouteIdx[i], stationRouteIdx[next_i]);
  stationDists[i] = { distFromPrev, distToNext };
}

// ─── Build popup HTML for a station ───
function stationPopupHTML(i) {
  const s = stationsData[i];
  const prev = stationsData[(i - 1 + stationsData.length) % stationsData.length];
  const next = stationsData[(i + 1) % stationsData.length];
  const d = stationDists[i];
  const num = (i + 1).toString().padStart(2, '0');
  return `<div class="station-popup">
    <div class="sp-hdr">🚉 ${num}. ${s.name}駅</div>
    <div class="sp-row">
      <span class="sp-arrow">⬆️ Prev</span>
      <span class="sp-station">${prev.name}駅</span>
      <span class="sp-dist">${d.distFromPrev.toFixed(2)} km</span>
    </div>
    <div class="sp-row">
      <span class="sp-arrow">📍 You are here</span>
      <span class="sp-this">${s.name}駅</span>
      <span class="sp-dist">—</span>
    </div>
    <div class="sp-row">
      <span class="sp-arrow">⬇️ Next</span>
      <span class="sp-station">${next.name}駅</span>
      <span class="sp-dist">${d.distToNext.toFixed(2)} km</span>
    </div>
  </div>`;
}

// ─── Map ───
const map = L.map('map', { zoomControl: true }).setView([35.687176733333324, 139.73865541], 12);

L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
  attribution: '&copy; <a href="https://carto.com/">CARTO</a> &copy; <a href="https://openstreetmap.org">OSM</a>',
  maxZoom: 19
}).addTo(map);

// Route line
L.geoJSON(routeGeoJSON, {
  style: function(feature) {
    if (feature.geometry.type === 'LineString') {
      return { color: '#d32f2f', weight: 5, opacity: 0.9 };
    }
  },
  pointToLayer: function(feature, latlng) {
    return L.circleMarker(latlng, {
      radius: 8, fillColor: '#ff6f00', color: '#bf360c', weight: 2, opacity: 1, fillOpacity: 0.85
    });
  }
}).addTo(map);

// ─── Station markers (clickable) ───
const markers = [];
stationsData.forEach((s, i) => {
  const marker = L.circleMarker([s.lat, s.lon], {
    radius: 9, fillColor: '#ffc107', color: '#d32f2f', weight: 3, opacity: 1, fillOpacity: 0.95
  }).addTo(map);
  
  marker.bindPopup(stationPopupHTML(i), { maxWidth: 280, className: '' });
  marker.on('click', () => {
    marker.setPopupContent(stationPopupHTML(i));
  });
  markers.push(marker);

  const num = (i + 1).toString().padStart(2, '0');
  const labelIcon = L.divIcon({
    className: 'station-label',
    html: `<div style="font-size:10px;font-weight:bold;color:#d32f2f;text-shadow:0 0 3px #fff,0 0 3px #fff;transform:translate(12px,-12px);white-space:nowrap;">${num}</div>`,
    iconSize: [0, 0]
  });
  L.marker([s.lat, s.lon], { icon: labelIcon }).addTo(map);
});

// ─── Station list buttons (clickable → opens popup on map) ───
const grid = document.getElementById('stations');
stationsData.forEach((s, i) => {
  const num = (i + 1).toString().padStart(2, '0');
  const div = document.createElement('div');
  div.className = 'station-item';
  div.innerHTML = `<div class="num">${num}</div>${s.name}`;
  div.addEventListener('click', () => {
    map.setView([s.lat, s.lon], 15);
    markers[i].openPopup();
  });
  grid.appendChild(div);
});

// Fit map to route bounds
const routeLayer = L.geoJSON(routeGeoJSON);
map.fitBounds(routeLayer.getBounds().pad(0.1));
</script>
</body>
</html>
